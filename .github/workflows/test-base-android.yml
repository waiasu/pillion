name: Test Base Android APK
on:
  push:
    branches: [test-base, 'test/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug
      - name: Lint (report upstream baseline findings)
        continue-on-error: true
        run: ./gradlew --no-daemon :androidApp:lintDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pillion-test-base-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic build outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pillion-test-base-build-failure
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
